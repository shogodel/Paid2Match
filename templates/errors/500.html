{% extends "base.html" %}

{% block title %}500 - {{ _('Server Error') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-1">500</h1>
            <h2>{{ _('Server Error') }}</h2>
            <p class="lead">{{ _('Something went wrong on our end.') }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">{{ _('Go Home') }}</a>
        </div>
    </div>
</div>
{% endblock %}
