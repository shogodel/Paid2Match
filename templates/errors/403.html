{% extends "base.html" %}

{% block title %}403 - {{ _('Forbidden') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-1">403</h1>
            <h2>{{ _('Forbidden') }}</h2>
            <p class="lead">{{ _("You don't have permission to do that.") }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">{{ _('Go Home') }}</a>
        </div>
    </div>
</div>
{% endblock %}
