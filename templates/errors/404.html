{% extends "base.html" %}

{% block title %}404 - {{ _('Page Not Found') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-1">404</h1>
            <h2>{{ _('Page Not Found') }}</h2>
            <p class="lead">{{ _("The page you're looking for doesn't exist.") }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">{{ _('Go Home') }}</a>
        </div>
    </div>
</div>
{% endblock %}
