{% extends "base.html" %}

{% block title %}Read Message{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card">
        <div class="card-body">
            <p class="text-muted small">From: {{ message.sender.full_name }}</p>
            <p class="text-muted small">{{ message.created_at.strftime('%B %d, %Y at %I:%M %p') }}</p>
            <hr>
            <p>{{ message.content }}</p>
        </div>
        <div class="card-footer">
            <a href="{{ url_for('messages.inbox') }}" class="btn btn-secondary">Back</a>
            <form method="POST" action="{{ url_for('messages.reply', message_id=message.id) }}" class="mt-3">
                <textarea name="content" class="form-control mb-2" placeholder="Write a reply..."></textarea>
                <button class="btn btn-primary">Send Reply</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
