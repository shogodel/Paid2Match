{% extends "base.html" %}

{% block title %}{{ _('Read Message') }}{% endblock %}

{% block content %}
<div class="container py-5 messages-view">
    <div class="card">
        <div class="card-body">
            <p class="text-muted small">{{ _('From:') }} {{ message.sender.full_name }}</p>
            <p class="text-muted small">{{ message.created_at.strftime('%B %d, %Y at %I:%M %p') }}</p>
            <hr>
            <p>{{ message.content }}</p>
        </div>
        <div class="card-footer">
            <a href="{{ url_for('messages.inbox') }}" class="btn btn-secondary">{{ _('Back') }}</a>
            <form method="POST" action="{{ url_for('messages.reply', message_id=message.id) }}" class="mt-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <textarea name="content" class="form-control mb-2" placeholder="{{ _('Write a reply...') }}"></textarea>
                <button class="btn btn-primary">{{ _('Send Reply') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
