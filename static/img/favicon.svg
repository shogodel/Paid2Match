<!-- Paid2Match favicon — the handshake mark on a warm tile.
     Light mode: warm-paper tile, terracotta mark. Dark mode (via the
     media query — Chrome/Firefox re-evaluate SVG favicons): dark tile,
     light terracotta mark. The tab icon says "Paid2Match", not
     "Canada" — the red-leaf favicon is retired (plan §1.3, L7). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #FAF7F4; }
    .mark { fill: #D9481C; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #221E1B; }
      .mark { fill: #F26B4A; }
    }
  </style>
  <defs>
    <mask id="p2m-hand-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <g stroke="black" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M28 19.5 L22.5 30"/>
        <path d="M33.5 23 C32.5 27 32 30 31.5 34"/>
        <path d="M23.5 40 L26.5 47"/>
        <path d="M28 39.5 L30.5 46.5"/>
        <path d="M40.5 40 L37.5 47"/>
        <path d="M36 39.5 L33.5 46.5"/>
      </g>
    </mask>
  </defs>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g class="mark" mask="url(#p2m-hand-gaps)" transform="translate(6.4 6.4) scale(0.8)">
    <path d="M14 28 L25 21 Q32 18.5 39 21 L50 28 L50 42 L45 42 a3.4 4.5 0 0 1 -6.5 0 a3.4 4.5 0 0 1 -6.5 0 a3.4 5 0 0 1 -6.5 0 a3.4 4.5 0 0 1 -6.5 0 L14 42 Z"/>
    <rect x="2.5" y="27" width="10" height="15" rx="2"/>
    <rect x="51.5" y="27" width="10" height="15" rx="2"/>
  </g>
</svg>
