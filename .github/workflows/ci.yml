name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app.py blueprints models extensions config.py

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:///:memory:
        run: python -m pytest -q
