name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # uwsgi is a C-extension WSGI server used only for deployment; it is not
          # needed to run the app or tests and frequently fails to build on CI
          # runners, which would abort the whole install. Exclude it here.
          grep -v '^uwsgi' requirements.txt > requirements_ci.txt
          pip install -r requirements_ci.txt

      - name: Compile check
        run: python -m compileall -q app.py blueprints models extensions config.py

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:///:memory:
        run: python -m pytest tests/ -q
